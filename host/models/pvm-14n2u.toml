# Sony PVM-14N2U (MCU CXP85220A-027S, VDP3108, EEPROM ST24C04). Source: register_map.md.
#
# eeprom = { at, size (1|2, little-endian), bits = [hi, lo] }
# vdp    = { fp = addr } | { reg = sub, size = 1|2 (big-endian), readable = true, bits = [hi, lo] }
# menu   = service-menu number (Ver 1.x), shown after the label
# signed = true | <bits>: show the decimal value as two's complement (true = the item's width)
# osd    = { offset, shift, hex }: on-screen value = (raw >> shift) - offset
# when   = "input=video" | "input=rgb" | "field=60" | "field=50": the VDP target only applies in that
#          context; live when [context] matches (read once per BINT session), else EEPROM-only.
# refresh = false: the MCU writes this VDP value only on change (not in its 1.3 s refresh)
# latch  = item key to rewrite after this one (white drive: R/G only take effect after WDB is written).
# min / max = safe range in the item's decimal units (signed for signed items); values outside need --force
#          (CLI) or a confirmation (panel).
# danger = { level = "high" | "medium" | "low", text }: name coloured in the panel, text shown before risky writes.
# help   = what the item does (manual ITEM column + datasheet), shown as the item's tooltip and by `pvm get`.
# [context]: how to find the active input (EEPROM byte) and line rate (FP value below/above a limit).
# Items without vdp are EEPROM-only, unless a [calc] uses them (the MCU calculates the VDP values).
# A model for another firmware can start with base = "<file>.toml" and list only what differs.

[model]
name = "Sony PVM-14N2U"
mcu = "CXP85220A-027S"
firmware = "1.x"
vdp = 0x45
eeprom = 0x50
protect = [0xFF]

[context]
input = { eeprom = 0x1E, map = { "0" = "video", "1" = "video", "2" = "rgb" } }
field = { fp = 0x0EB, below = 287, then = "60", else = "50" }

# Raw writes to these registers need --force (CLI) / a confirmation (panel).
[danger_regs]
"reg 15" = "Horizontal drive control (MCU constant 0x4768): H drive pulse width, H PLL enable, vertical protection. A wrong value can destroy the horizontal output transistor / flyback or disable the tube protection."
"fp 08B" = "Vertical sawtooth A0: written by the MCU from the geometry items; must match DSCV (FP 08F)."
"fp 08C" = "Vertical sawtooth A1 (slope = vertical size): near 0 collapses the vertical and can burn a line into the phosphor."
"fp 08F" = "DSCV, vertical retrace level: must equal A0 (FP 08B)."
"fp 0D3" = "BCLG, beam current limiter gain: bit 11 must stay 1; low values weaken the limiter."

# --- calculated VDP values (register_map.md) ---
# One [calc.<name>] per VDP value the MCU computes from several EEPROM items.
# target: fp = addr | reg = sub (size = 1|2, readable = true); a list for kind = "matrix".
# expr:   formula over item keys (+ - * / // % round min max abs). Each key is that item's EEPROM value,
#         two's complement if the item is signed. let.<name> = helper values, evaluated in order first.
# kind = "matrix": datasheet Table 3-3, target[i] = sum(weights[field][i][j] * terms[j]) (terms are formulas).
#         round = "each": round every product (halves away from zero) before summing, as the MCU does;
#         default: round the sum.
# bits:   result width, masked (default 16). when: as on items. uses: extra items for a calc without a formula.
# live = false: not written live (formula untested live, or not known: no expr); items that feed it stay
#         EEPROM-only and the MCU applies them on release. mirror: also write that FP (DSCV = A0).
# save_a0: EEPROM word where the MCU stores the computed A0 on SAVE. note: about the formula (shown on the
#         panel's "live calc" checkbox).
# Changing an item rewrites every calc that names it.

[calc.vertical]
kind = "matrix"
round = "each"
fp = [0x08B, 0x08C, 0x08D, 0x08E]
bits = 12
mirror = { "0x08B" = 0x08F }
save_a0 = 0x6E
terms = ["v_po + 1", "v_size / 128", "v_lin_down / 128", "v_line_up / 128"]
weights."60" = [[1, -1365, 683, -683], [0, 1084, -1090, 1646], [0, 0, 430, -1306], [0, 0, 0, 1024]]
weights."50" = [[1, -1365, 683, -683], [0, 900, -904, 1363], [0, 0, 296, -898], [0, 0, 0, 586]]
note = "Integer weights and each product rounded, both with halves away from zero. Exact at 60 and 50 Hz (tools/calcheck.py, 10-24)."

[calc.ew]
kind = "matrix"
round = "each"
fp = [0x09B, 0x09C, 0x09D, 0x09E, 0x09F]
bits = 12
terms = ["h_size + 1", "pin_phase / 128", "pin_amp / 128", "h_sexy_pin / 128", "h_cor_pin / 128"]
weights."60" = [[1, -341, 1365, -85, 341], [0, 135, -1084, 102, -549], [0, 0, 849, -161, 1306], [0, 0, 0, 126, -2047], [0, 0, 0, 0, 1585]]
weights."50" = [[1, -341, 1365, -85, 341], [0, 112, -900, 85, -455], [0, 0, 587, -111, 898], [0, 0, 0, 72, -1172], [0, 0, 0, 0, 757]]
note = "Integer weights and each product rounded, both with halves away from zero. Exact at 60 and 50 Hz (tools/calcheck.py, 10-24); 60 Hz A1 first weight 134 or 135 not decided."

[calc.ibr]
fp = 0x0F9
expr = "video_sbrt + 4 * (brightness - 50)"
live = false

[calc.abr]
fp = 0x0FA
expr = "rgb_sbrt + 4 * (brightness - 50)"
live = false

[calc.act]
fp = 0x0FB
let.lo = "round(rgb_cont * 81 / 256)"
expr = "lo + (rgb_cont - lo) * contrast // 100"
live = false
note = "RGB CONT is 9 bits (0x200 gave ACT 0): check how the MCU masks it."

[calc.ctm]
reg = 0x61
size = 1
expr = "20 + 43 * contrast // 100"
live = false

[calc.tint]
fp = 0x01C
bits = 12
expr = "tint + 4 * (phase - 50)"
live = false
note = "Trap mode (NTSC). Comb mode uses another base (A8?), untested."

[calc.matrix]
reg = [0x74, 0x6C, 0x64, 0x5C]
size = 2
uses = ["contrast", "chroma", "chroma_center"]
live = false
note = "Colour matrix MR2M/MG1M/MG2M/MB1M. Known: contrast only via CTM; coef = trunc(M x chroma / 100); cap = fixed 192/-48/-96/253 when MB1M > 253. Open: M from CTM and service CHROMA (register_map.md)."

# --- user settings (written by the MCU on every change, no SAVE) ---

[items.volume]
osd = { offset = 0 }
label = "VOLUME"
group = "user"
eeprom = { at = 0x10 }
help = "Audio volume (user menu). Drives the audio level directly from the MCU, not through the video processor."

[items.contrast]
osd = { offset = 0 }
label = "CONTRAST"
group = "user"
eeprom = { at = 0x11 }
help = "Picture contrast (user menu). Sets the VDP contrast (ACT on the RGB input, CTM) and scales the colour matrix."

[items.brightness]
osd = { offset = 50 }
label = "BRIGHTNESS"
group = "user"
eeprom = { at = 0x12 }
help = "Picture brightness (user menu). Added to the sub-brightness to give the VDP's brightness (IBR/ABR)."

[items.chroma]
osd = { offset = 50 }
label = "CHROMA"
group = "user"
eeprom = { at = 0x13 }
help = "Colour saturation (user menu), centred on 0. Scales the colour matrix together with contrast; capped by the MCU."

[items.phase]
osd = { offset = 50 }
label = "PHASE"
group = "user"
eeprom = { at = 0x14 }
help = "Hue / tint for NTSC (user menu), centred on 0. Sets the VDP tint angle (TINT)."

[items.system]
label = "SYSTEM"
group = "user"
eeprom = { at = 0x1C }
help = "Colour system / line standard selection: 00 auto, 01 525/60, 02 625/50."

[items.color_select]
label = "COLOR SELECT"
group = "user"
eeprom = { at = 0x15 }
help = "Colour standard (user menu): 00 auto, 01 NTSC comb, 05 SECAM seen; 02 NTSC, 03 NTSC443, 04 PAL probably (menu order). Sets VDP reg 34 (comb = 03); SECAM also forces 625/50 timing. Probably applied on BINT release (0x15 is in the reload's 0x10 read; untested)."

[items.input]
label = "INPUT"
group = "user"
eeprom = { at = 0x1E }
help = "Selected input: 00 LINE A, 01 LINE B, 02 RGB."

[items.prev_input]
label = "PREV INPUT"
group = "user"
eeprom = { at = 0x1F }
help = "The input selected before the current one (used to toggle back), same encoding as INPUT."

[items.model]
label = "MODEL"
menu = 63
group = "user"
eeprom = { at = 0x00 }
min = 1
max = 1
danger = { level = "medium", text = "0 tells the MCU this unit has no RGB input: after the next power-on or reload the RGB input may be unavailable. Keep 1 on a PVM-14N2U with RGB." }
help = "Model selection (service 63): 1 = model with the RGB input, 0 = without. Read by the MCU at power-on; no VDP effect."


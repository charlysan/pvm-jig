menu = 40
group = "tube"
eeprom = { at = 0x9A, size = 2, bits = [8, 0] }
vdp = { reg = 0x66, size = 2 }
danger = { level = "medium", text = "Changes the black level of that gun (higher = more beam current at black). Too much beam current can burn the phosphor, wear the cathodes and overload the high-voltage supply." }
help = "Blue cutoff: black level of the blue gun. Mapped by elimination (R and G tested)."


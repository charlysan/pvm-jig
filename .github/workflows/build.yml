name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build zips
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION=$GITHUB_REF_NAME; else VERSION=${GITHUB_SHA::7}; fi
          sh tools/build-release.sh "$VERSION"

      - name: Upload zips
        uses: actions/upload-artifact@v4
        with:
          name: zips
          path: dist/*.zip

  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install the AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Build firmware zip
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION=$GITHUB_REF_NAME; else VERSION=${GITHUB_SHA::7}; fi
          sh tools/build-firmware.sh "$VERSION"

      - name: Upload firmware zip
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*.zip

  publish:
    needs: [build, firmware]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download zips
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Get Release ID
        run: |
          RELEASE_ID=$(curl --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$GITHUB_REF_NAME" \
            | jq .id)
          if [ "$RELEASE_ID" = null ]; then
            echo "No release for tag $GITHUB_REF_NAME: create the release on GitHub, then re-run this job."
            exit 1
          fi
          echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV

      - name: Upload Release Assets
        run: |
          for f in *.zip; do
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/zip" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ env.RELEASE_ID }}/assets?name=$f" \
              > /dev/null
            echo "uploaded $f"
          done
